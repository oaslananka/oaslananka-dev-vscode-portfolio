name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/agent-ready-readability-20260925
    paths:
      - .github/workflows/temp-dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: fix/agent-ready-readability-20260925

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Refresh vulnerable production dependencies
        run: |
          npm pkg set 'dependencies.next=^16.3.3'
          npm pkg set 'overrides.fast-uri=^3.1.7'
          npm pkg set 'overrides.sharp=0.35.4'
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
          git diff --check

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): refresh security fixes"
          git push origin HEAD:fix/agent-ready-readability-20260925
