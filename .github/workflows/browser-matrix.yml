name: Browser matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ENV: development
      ALLOW_DEFAULT_CONTENT: 'true'
      E2E_GITHUB_FIXTURE: 'true'
      SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_GITHUB_USERNAME: oaslananka

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build deterministic public content
        run: npm run build

      - name: Install pinned browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Run deterministic visual baselines
        run: npm run test:e2e:visual

      - name: Run scheduled browser smoke tests
        run: npm run test:e2e:matrix

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-matrix-report
          path: playwright-report/
          retention-days: 7
