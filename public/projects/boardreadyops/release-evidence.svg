<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BoardReadyOps: review to release</title><desc id="desc">Verification is not fabrication sign-off. Signatures alone do not prove source-to-export provenance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131e2b"/><stop offset="1" stop-color="#0b1320"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#294056" stroke-opacity="0.24" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="70" y="61" width="11" height="25" rx="5" fill="#fb836e"/><text x="100" y="82" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="2.5" fill="#fb836e">EDA / MANUFACTURING GATES</text><text x="70" y="175" font-family="Arial,sans-serif" font-size="65" font-weight="700" fill="#edf3fa">BoardReadyOps: review to release</text><text x="72" y="233" font-family="Arial,sans-serif" font-size="29" fill="#a6b7c9">Local-first policy-as-code checks and reviewable manufacturing evidence</text><path d="M72 290H1528" stroke="#3c5066" stroke-width="2"/><rect x="72" y="356" width="340" height="353" rx="24" fill="#1c2938" stroke="#3c5066" stroke-width="2"/><rect x="99" y="383" width="67" height="56" rx="13" fill="#293f51"/><text x="114" y="421" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fb836e">01</text><text x="99" y="485" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#edf3fa">Design source</text><path d="M99 509H385" stroke="#3c5066" stroke-width="1.5"/><text x="100" y="561" font-family="Arial,sans-serif" font-size="21" fill="#a6b7c9">Inspect KiCad changes</text><text x="100" y="603" font-family="Arial,sans-serif" font-size="21" fill="#a6b7c9">Review configuration</text><tex