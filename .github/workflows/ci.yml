name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Restore drill self-test
        run: npm run test:restore-drill

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      DATABASE_URL_UNPOOLED: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      DATABASE_DRIVER: node-postgres
      CONTACT_NOTIFICATION_TEST_DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      RATE_LIMIT_TEST_DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      DB_PREFLIGHT_TEST_DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio_test
      AUTH_SECRET: ci-e2e-auth-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      E2E_GITHUB_FIXTURE: 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Drizzle v1 legacy migration compatibility
        run: npm run test:drizzle-upgrade

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Database preflight
        run: npm run db:preflight

      - name: Build
        run: npm run build:next

      - name: Enforce homepage HTML density
        run: npm run test:homepage-density

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ENV: development
      ALLOW_DEFAULT_CONTENT: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_GITHUB_USERNAME: oaslananka

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build deterministic public content
        run: npm run build

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:e2e:visual

      - name: Upload visual report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 7
