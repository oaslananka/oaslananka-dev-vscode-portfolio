version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "size/XS"
    # Keep Node type definitions aligned with the pinned Node 22 runtime.
    # Remove this guard only as part of a coordinated runtime/toolchain major upgrade.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      nextjs-react:
        applies-to: version-updates
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/third-parties"
          - "eslint-config-next"
      drizzle-toolchain:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      sentry:
        applies-to: version-updates
        patterns:
          - "@sentry/nextjs"
          - "@sentry/cli"
      development-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "size/XS"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
