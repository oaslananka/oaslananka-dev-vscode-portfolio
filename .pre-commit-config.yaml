default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: '4.6.0'

exclude: ^(lib/db/migrations/meta/|public/logos/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: eslint
        name: ESLint staged source files
        entry: npx eslint
        language: system
        files: \.[cm]?[jt]sx?$
        require_serial: true
      - id: typecheck
        name: TypeScript type check
        entry: npm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: unit-tests
        name: Unit and policy tests
        entry: npm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: semgrep
        name: Semgrep security scan
        entry: semgrep scan --config p/javascript --config p/typescript --config p/nextjs --config p/owasp-top-ten --error --metrics=off
        language: python
        additional_dependencies: [semgrep==1.170.0]
        pass_filenames: false
        stages: [pre-push]
