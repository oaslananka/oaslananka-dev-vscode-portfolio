name: SonarQube Cloud (advisory)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 1 * *'

permissions:
  contents: read

concurrency:
  group: sonar-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Explain unavailable advisory token
        if: env.SONAR_TOKEN == ''
        run: echo '::notice::SONAR_TOKEN is unavailable; the optional SonarQube advisory scan was skipped.'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: npm

      - name: Generate unit coverage
        if: env.SONAR_TOKEN != ''
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Run advisory SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.qualitygate.wait=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
