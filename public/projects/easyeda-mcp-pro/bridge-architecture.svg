<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EasyEDA MCP Pro bridge architecture</title>
  <desc id="desc">AI assistants call a profile-gated MCP server that communicates through a WebSocket bridge extension with EasyEDA Pro.</desc>
  <rect width="1600" height="900" fill="#11151b"/>
  <rect x="70" y="70" width="1460" height="760" rx="20" fill="#171c24" stroke="#343d49" stroke-width="2"/>
  <text x="120" y="150" fill="#f2f5f7" font-family="ui-monospace, monospace" font-size="40" font-weight="700">EasyEDA MCP Pro</text>
  <text x="120" y="198" fill="#9da8b5" font-family="ui-monospace, monospace" font-size="22">Controlled inspection, review, sourcing and export through a local bridge</text>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <rect x="105" y="340" width="300" height="170" rx="14" fill="#202833" stroke="#5f7085" stroke-width="2"/>
    <text x="255" y="412" fill="#f2f5f7" font-size="28" font-weight="700">AI ASSISTANT</text>
    <text x="255" y="456" fill="#9da8b5" font-size="19">stdio / Streamable HTTP</text>
    <rect x="515" y="285" width="570" height="280" rx="16" fill="#202833" stroke="#f0755b" stroke-width="3"/>
    <text x="800" y="350" fill="#f7a18e" font-size="26">PROFILE-GATED MCP SERVER</text>
    <text x="800" y="405" fill="#f2f5f7" font-size="22">Schematic • BOM • ERC/DRC • PCB • Export</text>
    <rect x="645" y="450" width="310" height="70" rx="10" fill="#171c24" stroke="#566273"/>
    <text x="800" y="494" fill="#c6d0d9" font-size="19">Explicit write confirmation</text>
    <rect x="1195" y="340" width="300" height="170" rx="14" fill="#162b26" stroke="#5cc8a1" stroke-width="2"/>
    <text x="1345" y="412" fill="#8ee3c4" font-size="28" font-weight="700">EASYEDA PRO</text>
    <text x="1345" y="456" fill="#c6d0d9" font-size="19">WebSocket bridge extension</text>
  </g>
  <g stroke="#5cc8a1" stroke-width="5" fill="none"><path d="M405 425H515"/><path d="M1085 425H1195"/></g>
  <g font-family="ui-monospace, monospace" font-size="21" fill="#9da8b5">
    <text x="120" y="690">Read surfaces remain separate from controlled mutation paths.</text>
    <text x="120" y="735">Raw runtime execution stays behind explicit experimental gates.</text>
  </g>
</svg>
